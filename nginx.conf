worker_processes 1;

events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    server {
        listen 8080;
        server_name _;

        # Railway clones your repo into /app
        root /app;

        # Remove SPA-style index fallback
        index;

        # ------------------------------
        # HOME PAGE
        # ------------------------------
        location = / {
            try_files /pages/index.html =404;
        }

        # ------------------------------
        # ROUTE HANDLER
        # /about → /pages/about.html
        # /kids/story1 → /pages/kids/story1.html
        # ------------------------------
        location / {
            # strip leading slash
            set $clean $uri;
            if ($clean ~ "^/(.+)") {
                set $clean $1;
            }

            try_files 
                $uri            # exact file
                $uri/           # folder index (if any)
                /pages/$clean.html   # your pages mapping
                =404;
        }

        # ------------------------------
        # STATIC FILES
        # ------------------------------
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ------------------------------
        # ROBOTS.TXT
        # ------------------------------
        location = /robots.txt {
            try_files /robots.txt =404;
            add_header Content-Type "text/plain";
        }

        # ------------------------------
        # SITEMAP.XML
        # ------------------------------
        location = /sitemap.xml {
            try_files /sitemap.xml =404;
            add_header Content-Type "application/xml";
        }

        # ------------------------------
        # BLOCK HIDDEN FILES
        # ------------------------------
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
