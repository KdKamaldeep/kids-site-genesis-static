worker_processes 1;

events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    server {
        listen 8080;
        server_name _;

        # IMPORTANT: serve directly from /app/pages
        root /app;
		index pages/index.html;

		

		location / {
			try_files $uri $uri/ /pages/$uri.html =404;
		}

        # Normal pages:
        # /storytelling-for-children.html → /app/pages/storytelling-for-children.html
        # /abc.html → /app/pages/abc.html
        location / {
            try_files $uri $uri/ =404;
        }

        # Static assets under pages (css, js, images, etc.)
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # robots.txt (if it's in repo root /app, NOT /app/pages)
        location = /robots.txt {
            root /app;
            add_header Content-Type "text/plain";
        }

        # sitemap.xml (if it's in repo root /app, NOT /app/pages)
        location = /sitemap.xml {
            root /app;
            add_header Content-Type "application/xml";
        }

        # Block hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
