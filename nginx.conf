# Nginx configuration for Kids Learning Hub (kidslearninghub.com)
# Generated automatically - do not edit manually
# 
# To use this configuration:
# 1. Copy this file to /etc/nginx/sites-available/kidslearninghub.com
# 2. Update the 'root' directive with the actual path to the tenant's public directory
# 3. Create symlink: ln -s /etc/nginx/sites-available/kidslearninghub.com /etc/nginx/sites-enabled/
# 4. Test: nginx -t
# 5. Reload: systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name kidslearninghub.com www.kidslearninghub.com;

    # Public root of your tenant
    root /;

    # Default index inside /pages
    index /pages/index.html;

    # Logging
    access_log /var/log/nginx/kids-access.log;
    error_log /var/log/nginx/kids-error.log;

    # Serve homepage
    location = / {
        try_files /pages/index.html =404;
    }

    # Serve any page as /slug → /pages/slug.html
    location / {
        try_files $uri $uri/ /pages/$uri.html =404;
    }

    # Static assets (css, js, images)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # robots.txt at root
    location = /robots.txt {
        try_files /robots.txt =404;
        add_header Content-Type "text/plain";
    }

    # sitemap.xml at root
    location = /sitemap.xml {
        try_files /sitemap.xml =404;
        add_header Content-Type "application/xml";
    }

    # Prevent access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
